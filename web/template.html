<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Waters · CDM Datathon-2026</title>
<style>
:root{--bg:#06111C;--panel:#0D1E2F;--line:#1C3550;--text:#EEF3F8;--t2:#B4C3D2;--t3:#7D92A8;
--amber:#F2B23C;--red:#F0575C;--green:#43C26B;--cyan:#56C8F0;--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px}

/* top bar: brand, three tabs, department */
.top{position:sticky;top:0;z-index:20;background:rgba(6,17,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:64px}
.brand{font-weight:800;letter-spacing:3px;font-size:16px;white-space:nowrap}.brand i{font-style:normal;color:var(--amber)}
.tabs{display:flex;gap:4px;margin:0 auto}
.tabs button{background:none;border:0;padding:10px 18px;border-radius:999px;color:var(--t2);font-weight:600;font-size:15px}
.tabs button:hover{color:var(--text)}.tabs button.on{background:var(--text);color:var(--bg)}
.who{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--t2);white-space:nowrap}
.who b{color:var(--rc,var(--amber))}.who:hover{border-color:var(--t3)}

.view{display:none;padding:44px 0 80px}.view.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kick{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3)}
.kick b{color:var(--rc,var(--amber))}

/* the verdict: the biggest thing on the page */
.verdict{margin:14px 0 12px;font-size:clamp(32px,4.6vw,54px);line-height:1.12;font-weight:800;letter-spacing:-.5px;max-width:1020px}
.verdict em{font-style:normal;color:var(--amber)}
.why{font-size:20px;color:var(--t2);max-width:820px;margin:0 0 36px}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:48px}
.num{background:var(--panel);border-radius:var(--r);padding:22px 24px}
.num .v{font-size:46px;font-weight:800;line-height:1.05;letter-spacing:-1px}
.num .l{color:var(--t2);font-size:16px;margin-top:6px}
.red{color:var(--red)}.amb{color:var(--amber)}.grn{color:var(--green)}.cya{color:var(--cyan)}

h2{font-size:28px;margin:0 0 6px;letter-spacing:-.3px}.sub{color:var(--t2);margin:0 0 20px}
.do{display:grid;gap:12px;margin-bottom:48px}
.act{display:grid;grid-template-columns:170px 1fr;gap:20px;align-items:start;background:var(--panel);border-radius:var(--r);padding:20px 24px;border-left:6px solid var(--line)}
.act.now{border-left-color:var(--amber)}.act .w{font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);padding-top:5px}
.act.now .w{color:var(--amber)}.act .t{font-size:21px;font-weight:600;line-height:1.35}
.act.now .t{font-size:24px}

.card{background:var(--panel);border-radius:var(--r);padding:22px 24px}
.chart{width:100%;height:340px}
.note{color:var(--t3);font-size:14px;margin-top:10px}
details{margin-top:18px;color:var(--t2)}summary{cursor:pointer;color:var(--t3);font-size:15px}
details ul{margin:10px 0 0;padding-left:20px}details li{margin:4px 0}

/* 2027: three steps */
.step{display:grid;grid-template-columns:64px 1fr;gap:18px;margin-bottom:60px}
.step .n{width:56px;height:56px;border-radius:50%;background:var(--amber);color:var(--bg);font-size:26px;font-weight:800;display:grid;place-items:center}
.step h3{font-size:clamp(26px,3.2vw,38px);line-height:1.18;margin:4px 0 18px;letter-spacing:-.3px}
.step h3 em{font-style:normal;color:var(--amber)}
.pills{display:inline-flex;background:var(--panel);border-radius:999px;padding:4px;margin-bottom:16px;flex-wrap:wrap}
.pills button{background:none;border:0;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--t2)}
.pills button.on{background:var(--text);color:var(--bg)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.who-does{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.wd{background:var(--panel);border-radius:var(--r);padding:18px 20px;border-top:4px solid var(--rc)}
.wd .d{font-weight:800;letter-spacing:1.5px;font-size:14px;color:var(--rc)}.wd .t{font-size:17px;margin-top:6px}
.wd.me{outline:2px solid var(--rc)}

/* explore */
.ex{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.ex .map{height:575px}
.slider{margin:10px 0 2px}.slider label{display:flex;justify-content:space-between;color:var(--t2);font-size:15px}
.slider label b{color:var(--amber);font-size:18px}
input[type=range]{width:100%;accent-color:var(--amber);height:28px}
.big-out{font-size:64px;font-weight:800;line-height:1;margin:18px 0 4px}

/* department picker */
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:none}.gate.on{display:block}
.gate .wrap{padding-top:9vh;padding-bottom:60px}
.gate h1{font-size:clamp(34px,5vw,52px);margin:10px 0 8px;letter-spacing:-.5px}
.gate p{color:var(--t2);font-size:19px;margin:0 0 32px;max-width:700px}
.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gc{display:flex;flex-direction:column;justify-content:flex-start;background:var(--panel);border:2px solid transparent;border-radius:var(--r);padding:20px;text-align:left;transition:border-color .15s,transform .15s}
.gc:hover,.gc:focus-visible{border-color:var(--rc);transform:translateY(-2px);outline:none}
.gc .s{font-weight:800;font-size:19px;color:var(--rc);letter-spacing:.5px}.gc .f{color:var(--t2);font-size:15px;margin-top:6px}
.gc.all{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:16px;--rc:var(--text)}

.foot{border-top:1px solid var(--line);padding:22px 0;color:var(--t3);font-size:13px}
.foot .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.foot a{color:var(--t2)}
@media(max-width:860px){.nums{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.view{padding-top:28px}.chart{height:280px}.act{grid-template-columns:1fr;gap:4px}.ex,.who-does,.gg{grid-template-columns:1fr}
 .gc.all{display:block}.top .wrap{gap:10px;padding:0 14px}.brand{display:none}.tabs button{padding:8px 11px;font-size:14px}.step{grid-template-columns:1fr}.num .v{font-size:36px}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="brand">DARK<i>·</i>WATERS</div>
  <nav class="tabs"><button data-v="verdict" class="on">Verdict</button><button data-v="y2027">2027</button><button data-v="explore">Explore</button></nav>
  <button class="who" id="who"></button>
</div></div>

<main class="wrap">
  <section class="view on" id="v-verdict"></section>
  <section class="view" id="v-y2027"></section>
  <section class="view" id="v-explore"></section>
</main>

<footer class="foot"><div class="wrap">
  <span>Dark Waters · CDM Datathon-2026 · Theme 6.2 · Capt Siddharth Sangwan, FCE/MCTE Mhow · Unclassified, open-source data</span>
  <span><a id="analyst" href="#">Full analyst dashboard ↗</a> · Run <span id="rid"></span></span>
</div></footer>

<div class="gate" id="gate"><div class="wrap" id="gateIn"></div></div>

</body>
</html>
